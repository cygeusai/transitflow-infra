name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Migration repository fidelity.
  #
  # This job replaces a `supabase db reset` replay that could never pass. The
  # replay applied the repository's migration files to an empty local Postgres.
  # Production has applied 320 migrations; the repository holds a subset of the
  # files. The first file replayed references objects created by migrations that
  # are not in the repository, so the reset aborted immediately, every run, from
  # the day the workflow was added. Several of the committed migrations also
  # assert against live production data and absolute row counts, so they would
  # fail against a seedless database even after a complete backfill.
  #
  # What this job does instead is verify what the repository honestly is: a
  # partial, growing mirror of one live database, plus an authoritative manifest
  # of everything that database has executed. It checks that the files present
  # match what production actually ran, byte for byte, and that coverage never
  # regresses. See docs/CI_REPOSITORY_FIDELITY.md.
  #
  # It needs no database connection and no credentials.
  # ---------------------------------------------------------------------------
  migration-fidelity:
    name: Verify migration fidelity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install SQL parser
        # pglast wraps libpg_query, the real PostgreSQL parser, so the syntax
        # check is the server's own opinion rather than a regex approximation.
        run: pip install --quiet pglast

      - name: Prove the gate refuses
        # House rule twenty-three: an assertion's failure path is code, and
        # untested code. This breaks a disposable copy of the repository ten
        # different ways and requires a refusal each time, before the gate is
        # allowed to report anything about the real tree.
        run: python3 scripts/test_verify_migration_manifest.py

      - name: Verify repository against the applied manifest
        run: python3 scripts/verify_migration_manifest.py

  # ---------------------------------------------------------------------------
  # Edge function type checking. Unchanged in substance; the loop now fails
  # loudly on a real error and reports honestly when there is nothing to check,
  # rather than passing on an unexpanded glob.
  # ---------------------------------------------------------------------------
  edge-functions:
    name: Type-check edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Check functions compile
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/functions/*/index.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::warning title=Edge functions::No edge function sources are present in this repository."
            echo "Deployed functions live only in the Supabase project. Run ./scripts/pull-backend.sh to mirror them."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Checking $f"
            deno check "$f"
          done
          echo "${#files[@]} edge function(s) type-checked."
